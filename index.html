const { useState, useEffect, useCallback, useRef } = React;

function uid() { return Math.random().toString(36).slice(2, 8); }

function compressCategories(categories) {
  return categories.map(c => ({
    n: c.name, a: c.inA ? 1 : 0, b: c.inB ? 1 : 0,
    i: c.items.map(it => ({ v: it.value, l: it.label, w: it.weight }))
  }));
}
function decompressCategories(data) {
  return data.map(c => ({
    id: uid(), name: c.n, inA: !!c.a, inB: !!c.b,
    items: (c.i || []).map(it => ({ id: uid(), value: it.v, label: it.l, weight: it.w }))
  }));
}
function encodeData(categories) {
  try { return btoa(JSON.stringify(compressCategories(categories))); } catch { return ""; }
}
function decodeData(str) {
  try {
    const raw = JSON.parse(atob(str));
    if (Array.isArray(raw) && raw[0] && "n" in raw[0]) return decompressCategories(raw);
    return raw;
  } catch { return null; }
}
function getShareURL(categories) {
  const params = new URLSearchParams({ d: encodeData(categories) });
  return `${window.location.href.split("?")[0]}?${params}`;
}
function loadFromURL() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get("d");
  return d ? decodeData(d) : null;
}

const MULTIPLES_OF_5 = Array.from({ length: 19 }, (_, i) => (i + 1) * 5);

// Category data (names, items, labels, weights, A/B assignment) persists
// in the browser until the user hits Reset to Defaults.
const CATEGORIES_KEY = "payout_categories_v4";
function loadCategoriesFromStorage() {
  try { const s = localStorage.getItem(CATEGORIES_KEY); return s ? JSON.parse(s) : null; } catch { return null; }
}
function saveCategoriesToStorage(cats) {
  try { localStorage.setItem(CATEGORIES_KEY, JSON.stringify(cats)); } catch {}
}
function clearCategoriesStorage() {
  try { localStorage.removeItem(CATEGORIES_KEY); } catch {}
}

const MAX_ANSWER = 100000;

// Adaptive frequency: for any value in a category with more than one item
// (either set), starts at the item's stored weight (2 by default), bumps
// +1 per miss, caps at 5. Persisted per browser. Single-value categories
// (like a one-item Ratios category) are left static.
const ADAPTIVE_KEY = "payout_adaptive_weights_v1";
function loadAdaptive() {
  try { const s = localStorage.getItem(ADAPTIVE_KEY); return s ? JSON.parse(s) : {}; } catch { return {}; }
}
function saveAdaptive(map) {
  try { localStorage.setItem(ADAPTIVE_KEY, JSON.stringify(map)); } catch {}
}
function clearAdaptive() {
  try { localStorage.removeItem(ADAPTIVE_KEY); } catch {}
}
function buildAdaptiveEligibility(categories) {
  const eligible = new Set();
  for (const cat of categories) if (cat.items.length > 1) for (const it of cat.items) eligible.add(it.id);
  return eligible;
}
function getEffectiveWeight(item, adaptiveWeights, eligibleIds) {
  if (!eligibleIds.has(item.id)) return item.weight;
  const v = adaptiveWeights[item.id];
  return v !== undefined ? v : item.weight;
}

const TIMED_COUNT_KEY = "payout_timed_count_v1";
function loadTimedCount() {
  try {
    const s = localStorage.getItem(TIMED_COUNT_KEY);
    const n = s ? parseInt(s, 10) : 60;
    return (Number.isFinite(n) && n > 0) ? n : 60;
  } catch { return 60; }
}
function saveTimedCount(n) {
  try { localStorage.setItem(TIMED_COUNT_KEY, String(n)); } catch {}
}
function clearTimedCount() {
  try { localStorage.removeItem(TIMED_COUNT_KEY); } catch {}
}

function buildPool(catA, catB, adaptiveWeights, eligibleIds) {
  const pool = [];
  for (const a of catA.items)
    for (const b of catB.items) {
      if (a.value * b.value > MAX_ANSWER) continue;
      const wA = getEffectiveWeight(a, adaptiveWeights, eligibleIds);
      const wB = getEffectiveWeight(b, adaptiveWeights, eligibleIds);
      const w = Math.round((wA + wB) / 2);
      for (let i = 0; i < w; i++) pool.push({ a, b });
    }
  return shuffle(pool);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function mergeSelected(categories, key) {
  const selected = categories.filter(c => c[key]);
  return mergeCats(selected);
}

function mergeCats(selected) {
  const seen = new Set();
  const items = [];
  for (const cat of selected)
    for (const it of cat.items)
      if (!seen.has(it.id)) { seen.add(it.id); items.push(it); }
  return { name: selected.map(c => c.name).join(" + ") || "None", items };
}

function WeightDots({ value, onChange }) {
  return (
    <div className="weight-dots">
      {[1,2,3,4,5].map(n => (
        <div key={n} className={`wdot ${n <= value ? "filled" : ""}`} onClick={() => onChange(n)} />
      ))}
    </div>
  );
}

function SetPills({ inA, inB, onToggleA, onToggleB }) {
  return (
    <div className="pill-row">
      <span className="cat-set-label">Set</span>
      <div className={`set-pill pill-a ${inA ? "on" : ""}`} onClick={onToggleA} title="Include in Set A">A</div>
      <div className={`set-pill pill-b ${inB ? "on" : ""}`} onClick={onToggleB} title="Include in Set B">B</div>
    </div>
  );
}

function CategoryEditor({ cat, onChange, onDelete, adaptiveWeights, onSetAdaptive }) {
  const [newVal, setNewVal] = useState("");
  const [newLabel, setNewLabel] = useState("");
  const valRef = useRef();
  const isAdaptive = cat.items.length > 1;

  const updateName = name => onChange({ ...cat, name });
  const toggleInA = () => onChange({ ...cat, inA: !cat.inA });
  const toggleInB = () => onChange({ ...cat, inB: !cat.inB });
  const updateItem = (id, patch) =>
    onChange({ ...cat, items: cat.items.map(it => it.id === id ? { ...it, ...patch } : it) });
  const removeItem = id =>
    onChange({ ...cat, items: cat.items.filter(it => it.id !== id) });
  const addItem = () => {
    const v = parseFloat(newVal);
    if (isNaN(v)) return;
    const label = newLabel.trim() || String(v);
    onChange({ ...cat, items: [...cat.items, { id: uid(), value: v, label, weight: 2 }] });
    setNewVal(""); setNewLabel("");
    valRef.current?.focus();
  };

  const effectiveWeight = it => isAdaptive && adaptiveWeights[it.id] !== undefined ? adaptiveWeights[it.id] : it.weight;
  const handleWeightChange = (it, w) => {
    if (isAdaptive) onSetAdaptive(it.id, w);
    else updateItem(it.id, { weight: w });
  };

  return (
    <div>
      <div className="cat-header">
        <input className="cat-name-input" value={cat.name} onChange={e => updateName(e.target.value)} placeholder="Category name" />
        <SetPills inA={cat.inA} inB={cat.inB} onToggleA={toggleInA} onToggleB={toggleInB} />
        <button className="btn btn-danger btn-sm" onClick={onDelete}>Delete</button>
      </div>
      {isAdaptive && (
        <p style={{fontSize:"0.74rem",color:"#5a5a7a",marginBottom:"0.75rem"}}>
          Frequency auto-adjusts as values are missed during drills (capped at 5). You can still override it manually below.
        </p>
      )}
      <table className="items-table">
        <thead>
          <tr>
            <th style={{width:76}}>Value</th>
            <th>Label</th>
            <th className="right" style={{width:80}}>Frequency</th>
            <th style={{width:28}}></th>
          </tr>
        </thead>
        <tbody>
          {cat.items.map(it => (
            <tr key={it.id}>
              <td><input className="item-val-input" type="number" value={it.value} onChange={e => updateItem(it.id, { value: parseFloat(e.target.value) || 0 })} /></td>
              <td><input className="item-label-input" value={it.label} onChange={e => updateItem(it.id, { label: e.target.value })} placeholder="Label…" /></td>
              <td><WeightDots value={effectiveWeight(it)} onChange={w => handleWeightChange(it, w)} /></td>
              <td><button className="btn btn-icon btn-ghost" onClick={() => removeItem(it.id)} style={{color:"#f08090"}}>✕</button></td>
            </tr>
          ))}
        </tbody>
      </table>
      <div className="add-item-row">
        <input ref={valRef} className="item-val-input" type="number" placeholder="Value" value={newVal}
          onChange={e => setNewVal(e.target.value)} onKeyDown={e => e.key === "Enter" && addItem()} />
        <input className="item-label-input" placeholder="Label (optional)" value={newLabel}
          onChange={e => setNewLabel(e.target.value)} onKeyDown={e => e.key === "Enter" && addItem()} />
        <button className="btn btn-ghost btn-sm" onClick={addItem}>Add</button>
      </div>
    </div>
  );
}

function App() {
  const [categories, setCategories] = useState(() => loadFromURL() || loadCategoriesFromStorage() || defaultCategories());
  // Session-only: which Set-A / Set-B categories are active for the drill right now.
  // This never touches category.inA / category.inB — purely a temporary include/exclude toggle.
  const [activeA, setActiveA] = useState(() => new Set());
  const [activeB, setActiveB] = useState(() => new Set());
  const [mainTab, setMainTab] = useState("drill");
  const [activeCatId, setActiveCatId] = useState(null);
  const [mode, setMode] = useState("drill");
  const [screen, setScreen] = useState("setup");
  const [questions, setQuestions] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [answer, setAnswer] = useState("");
  const [feedback, setFeedback] = useState(null);
  const [missed, setMissed] = useState([]);
  const [score, setScore] = useState(0);
  const [copied, setCopied] = useState(false);
  const [confirmingReset, setConfirmingReset] = useState(false);
  const [adaptiveWeights, setAdaptiveWeights] = useState(() => loadAdaptive());
  const [timedCount, setTimedCount] = useState(() => loadTimedCount());
  const [timeElapsed, setTimeElapsed] = useState(0);
  const timerRef = useRef(null);

  const bumpAdaptive = (itemId, baseWeight) => {
    setAdaptiveWeights(prev => {
      const cur = prev[itemId] !== undefined ? prev[itemId] : baseWeight;
      const next = Math.min(5, cur + 1);
      const updated = { ...prev, [itemId]: next };
      saveAdaptive(updated);
      return updated;
    });
  };

  const setAdaptive = (itemId, weight) => {
    setAdaptiveWeights(prev => {
      const updated = { ...prev, [itemId]: weight };
      saveAdaptive(updated);
      return updated;
    });
  };

  const resetToDefaults = () => {
    clearAdaptive();
    clearTimedCount();
    clearCategoriesStorage();
    setAdaptiveWeights({});
    setTimedCount(60);
    setCategories(defaultCategories());
    setActiveA(new Set());
    setActiveB(new Set());
    setConfirmingReset(false);
  };

  useEffect(() => {
    saveCategoriesToStorage(categories);
    if (!activeCatId && categories.length > 0) setActiveCatId(categories[0].id);
    if (activeCatId && !categories.find(c => c.id === activeCatId))
      setActiveCatId(categories[0]?.id || null);
    const idsInA = new Set(categories.filter(c => c.inA).map(c => c.id));
    setActiveA(prev => new Set([...prev].filter(id => idsInA.has(id))));
    const idsInB = new Set(categories.filter(c => c.inB).map(c => c.id));
    setActiveB(prev => new Set([...prev].filter(id => idsInB.has(id))));
  }, [categories]);

  const updateCat = updated => setCategories(cats => cats.map(c => c.id === updated.id ? updated : c));
  const deleteCat = id => setCategories(cats => cats.filter(c => c.id !== id));
  const addCategory = () => {
    const newCat = { id: uid(), name: "New Category", inA: false, inB: false, items: [] };
    setCategories(cats => [...cats, newCat]);
    setActiveCatId(newCat.id);
  };

  const catA = mergeCats(categories.filter(c => c.inA && activeA.has(c.id)));
  const catB = mergeCats(categories.filter(c => c.inB && activeB.has(c.id)));
  const canDrill = catA.items.length > 0 && catB.items.length > 0;
  const eligibleIds = buildAdaptiveEligibility(categories);
  const poolSize = canDrill
    ? catA.items.reduce((s,a) => s + catB.items.reduce((t,b) =>
        t + (a.value * b.value > MAX_ANSWER ? 0 : Math.round((getEffectiveWeight(a,adaptiveWeights,eligibleIds)+getEffectiveWeight(b,adaptiveWeights,eligibleIds))/2)), 0), 0)
    : 0;

  const startQuiz = () => {
    let pool = buildPool(catA, catB, adaptiveWeights, eligibleIds);
    if (!pool.length) return;
    if (mode === "timed") {
      // Weighted shuffle first (biases order toward higher-weight pairs),
      // then strip repeats so each A×B combo appears at most once.
      const seen = new Set();
      const unique = [];
      for (const q of pool) {
        const key = q.a.id + "|" + q.b.id;
        if (seen.has(key)) continue;
        seen.add(key);
        unique.push(q);
      }
      const n = Number.isFinite(timedCount) && timedCount > 0 ? timedCount : 60;
      pool = unique.slice(0, n);
    }
    setQuestions(pool); setQIndex(0); setAnswer(""); setFeedback(null); setMissed([]); setScore(0);
    if (mode === "timed") { setTimeElapsed(0); }
    setScreen(mode === "timed" ? "timed" : "quiz");
  };

  useEffect(() => {
    if (screen === "timed") {
      const start = Date.now();
      timerRef.current = setInterval(() => {
        setTimeElapsed(Math.floor((Date.now() - start) / 1000));
      }, 500);
    } else {
      clearInterval(timerRef.current);
    }
    return () => clearInterval(timerRef.current);
  }, [screen]);

  const submitAnswer = useCallback(() => {
    if (feedback) return;
    const q = questions[qIndex];
    const correct = Math.ceil(q.a.value * q.b.value);
    const given = parseFloat(answer);
    const isCorrect = given === correct;
    if (isCorrect) setScore(s => s + 1);
    else {
      setMissed(m => [...m, { q, given, correct }]);
      if (eligibleIds.has(q.a.id)) bumpAdaptive(q.a.id, q.a.weight);
      if (eligibleIds.has(q.b.id)) bumpAdaptive(q.b.id, q.b.weight);
    }
    if (screen === "timed") {
      const next = qIndex + 1;
      if (next >= questions.length) { clearInterval(timerRef.current); setScreen("results"); }
      else { setQIndex(next); setAnswer(""); }
    } else {
      setFeedback(isCorrect ? "correct" : "wrong");
      setTimeout(() => {
        if (qIndex + 1 >= questions.length) setScreen("results");
        else { setQIndex(i => i + 1); setAnswer(""); setFeedback(null); }
      }, 900);
    }
  }, [feedback, questions, qIndex, answer, screen, adaptiveWeights, eligibleIds]);

  useEffect(() => {
    const handler = e => {
      if (e.key === "Enter" && (screen === "quiz" || screen === "timed") && answer !== "" && !feedback) submitAnswer();
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [screen, answer, feedback, submitAnswer]);

  const copyShare = () => {
    const url = getShareURL(categories);
    navigator.clipboard.writeText(url).then(() => {
      setCopied(true); setTimeout(() => setCopied(false), 2200);
    }).catch(() => {});
  };

  const pct = questions.length ? Math.round((score / questions.length) * 100) : 0;

  // ── Drill quiz ──
  if (screen === "quiz" && questions.length > 0) {
    const q = questions[qIndex];
    return (
      <div className="app">
        <div className="quiz-meta">
          <span>{qIndex + 1} / {questions.length}</span>
          <span>{score} correct</span>
          <button className="btn btn-ghost btn-sm" onClick={() => setScreen("setup")}>✕ Quit</button>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{width:`${(qIndex/questions.length)*100}%`}}/></div>
        <div className="question-display">
          <div style={{fontSize:"clamp(1rem,4.5vw,1.8rem)",lineHeight:1.35,wordBreak:"break-word",padding:"0 0.5rem",textAlign:"center",fontFamily:"'Space Mono',monospace",color:"#e8e6f0"}}>
            {q.a.label} × {q.b.label}
          </div>
        </div>
        <input className={`answer-input ${feedback||""}`} type="number" placeholder="?" value={answer}
          onChange={e => setAnswer(e.target.value)} autoFocus readOnly={!!feedback} />
        <div className={`feedback ${feedback||""}`}>
          {feedback === "correct" && "✓ Correct!"}
          {feedback === "wrong" && `✗ Answer: ${Math.ceil(questions[qIndex].a.value * questions[qIndex].b.value)}`}
        </div>
        {!feedback && answer !== "" && <button className="btn btn-green btn-check" onClick={submitAnswer}>Check</button>}
      </div>
    );
  }

  // ── Timed quiz ──
  if (screen === "timed" && questions.length > 0) {
    const q = questions[qIndex];
    const mins = String(Math.floor(timeElapsed/60)).padStart(2,"0");
    const secs = String(timeElapsed%60).padStart(2,"0");
    return (
      <div className="app">
        <div className="quiz-meta">
          <span>{qIndex+1} / {questions.length}</span>
          <span>{score} correct</span>
          <button className="btn btn-ghost btn-sm" onClick={() => { clearInterval(timerRef.current); setScreen("setup"); }}>✕ Quit</button>
        </div>
        <div className="timer-display ok">{mins}:{secs}</div>
        <div className="progress-bar" style={{marginBottom:"1rem"}}><div className="progress-fill" style={{width:`${(qIndex/questions.length)*100}%`}}/></div>
        <div className="question-display">
          <div style={{fontSize:"clamp(1rem,4.5vw,1.8rem)",lineHeight:1.35,wordBreak:"break-word",padding:"0 0.5rem",textAlign:"center",fontFamily:"'Space Mono',monospace",color:"#e8e6f0"}}>
            {q.a.label} × {q.b.label}
          </div>
        </div>
        <input className="answer-input" type="number" placeholder="?" value={answer}
          onChange={e => setAnswer(e.target.value)} autoFocus />
        {answer !== "" && <button className="btn btn-green btn-check" onClick={submitAnswer}>Next</button>}
      </div>
    );
  }

  // ── Results ──
  if (screen === "results") {
    const isTimed = mode === "timed";
    const mins = String(Math.floor(timeElapsed/60)).padStart(2,"0");
    const secs = String(timeElapsed%60).padStart(2,"0");
    return (
      <div className="app">
        <h1>Payout Practice</h1>
        <div className="card">
          {isTimed ? (
            <div className="timed-stat-row">
              <div className="timed-stat"><div className="timed-stat-val">{questions.length ? Math.round((score/questions.length)*100) : 0}%</div><div className="timed-stat-lbl">Correct</div></div>
              <div className="timed-stat"><div className="timed-stat-val" style={{color:"#f0a060"}}>{mins}:{secs}</div><div className="timed-stat-lbl">Time</div></div>
              <div className="timed-stat"><div className="timed-stat-val" style={{color:missed.length===0?"#6af09a":"#f08090"}}>{missed.length}</div><div className="timed-stat-lbl">Missed</div></div>
            </div>
          ) : (
            <>
              <div className="results-score">{pct}%</div>
              <div className="results-label">{score} / {questions.length} correct</div>
            </>
          )}
          {missed.length > 0 && (
            <>
              <div className="card-title">Missed</div>
              <div className="missed-list">
                {missed.map(({ q, given, correct }, i) => (
                  <div key={i} className="missed-item">
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:"0.88rem",color:"#c9c9e9",marginBottom:"0.15rem"}}>{q.a.label} × {q.b.label}</div>
                      <div style={{display:"flex",gap:"0.5rem"}}>
                        <span className="missed-set-a">A: {q.a.value}</span>
                        <span style={{color:"#2a2a3a"}}>·</span>
                        <span className="missed-set-b">B: {q.b.value}</span>
                      </div>
                    </div>
                    <span style={{flexShrink:0}}>
                      <span className="missed-yours">{isNaN(given)?"—":given} </span>
                      <span style={{color:"#3a3a5a"}}>→ </span>
                      <span className="missed-correct">{Math.ceil(correct)}</span>
                    </span>
                  </div>
                ))}
              </div>
            </>
          )}
          <div className="results-actions">
            <button className="btn btn-ghost" onClick={() => setScreen("setup")}>Back</button>
            <button className="btn btn-green" onClick={startQuiz}>Retry</button>
          </div>
        </div>
      </div>
    );
  }

  // ── Setup ──
  const activeCat = categories.find(c => c.id === activeCatId);
  return (
    <div className="app">
      <h1>Payout Practice</h1>
      <div className="nav-tabs">
        <button className={`nav-tab ${mainTab==="drill"?"active":""}`} onClick={() => setMainTab("drill")}>Drill</button>
        <button className={`nav-tab ${mainTab==="edit"?"active":""}`} onClick={() => setMainTab("edit")}>Edit Categories</button>
      </div>

      {mainTab === "drill" && (
        <>
          <div className="mode-toggle">
            <button className={`mode-btn ${mode==="drill"?"active-drill":""}`} onClick={() => setMode("drill")}>Drill</button>
            <button className={`mode-btn ${mode==="timed"?"active-timed":""}`} onClick={() => setMode("timed")}>⏱ Timed Test</button>
          </div>
          <div className="card">
            <div className="card-title">Choose what to multiply</div>
            <div className="drill-setup">
              <div className="drill-col">
                <div className="drill-col-title title-a">Set A</div>
                {(() => {
                  const assignedA = categories.filter(c => c.inA);
                  const allOn = assignedA.length > 0 && assignedA.every(c => activeA.has(c.id));
                  return assignedA.length > 0 ? (
                    <button className={`drill-cat-btn all-btn ${allOn?"sel-a":""}`}
                      onClick={() => setActiveA(prev => {
                        const next = new Set(prev);
                        for (const c of assignedA) { if (allOn) next.delete(c.id); else next.add(c.id); }
                        return next;
                      })}>
                      All
                      <span style={{color:allOn?"#3a5a3a":"#3a3a5a",fontWeight:400,fontSize:"0.76rem",marginLeft:"0.4rem"}}>
                        ({assignedA.reduce((s,c)=>s+c.items.length,0)})
                      </span>
                    </button>
                  ) : null;
                })()}
                {categories.filter(c=>c.inA).length===0 && <div style={{fontSize:"0.78rem",color:"#3a3a5a",padding:"0.4rem 0"}}>No categories assigned — go to Edit Categories</div>}
                {categories.filter(c=>c.inA).map(c => (
                  <button key={c.id} className={`drill-cat-btn ${activeA.has(c.id)?"sel-a":""}`}
                    onClick={() => setActiveA(prev => {
                      const next = new Set(prev);
                      if (next.has(c.id)) next.delete(c.id); else next.add(c.id);
                      return next;
                    })}>
                    {c.name}
                    <span style={{color:activeA.has(c.id)?"#3a5a3a":"#3a3a5a",fontWeight:400,fontSize:"0.76rem",marginLeft:"0.4rem"}}>({c.items.length})</span>
                  </button>
                ))}
                {categories.filter(c=>activeA.has(c.id)).length>1 && <div className="drill-hint">Merged into one pool</div>}
              </div>
              <div className="vs-divider">×</div>
              <div className="drill-col">
                <div className="drill-col-title title-b">Set B</div>
                {categories.filter(c=>c.inB).length===0 && <div style={{fontSize:"0.78rem",color:"#3a3a5a",padding:"0.4rem 0"}}>No categories assigned — go to Edit Categories</div>}
                {categories.filter(c=>c.inB).map(c => (
                  <button key={c.id} className={`drill-cat-btn ${activeB.has(c.id)?"sel-b":""}`}
                    onClick={() => setActiveB(prev => {
                      const next = new Set(prev);
                      if (next.has(c.id)) next.delete(c.id); else next.add(c.id);
                      return next;
                    })}>
                    {c.name}
                    <span style={{color:activeB.has(c.id)?"#2a3a5a":"#3a3a5a",fontWeight:400,fontSize:"0.76rem",marginLeft:"0.4rem"}}>({c.items.length})</span>
                  </button>
                ))}
                {categories.filter(c=>activeB.has(c.id)).length>1 && <div className="drill-hint">Merged into one pool</div>}
              </div>
            </div>
          </div>

          {canDrill && (
            <div className="card" style={{marginBottom:"1rem"}}>
              <div className="card-title">Preview</div>
              <p style={{fontSize:"0.82rem",color:"#7a7a9a"}}>
                <strong style={{color:"#8af0b0"}}>{catA.name}</strong> ({catA.items.length} items) ×{" "}
                <strong style={{color:"#80c0f0"}}>{catB.name}</strong> ({catB.items.length} items) — ~{poolSize} questions
              </p>
            </div>
          )}

          {mode === "timed" && (
            <div style={{fontSize:"0.8rem",color:"#7a5a3a",background:"#1a1208",border:"1px solid #3a2a10",borderRadius:"8px",padding:"0.6rem 0.9rem",marginBottom:"0.75rem"}}>
              ⏱ Answer as fast as you can. No feedback between questions. Results show time, score, and every missed question.
              <div style={{display:"flex",alignItems:"center",gap:"0.5rem",marginTop:"0.6rem"}}>
                <label style={{fontSize:"0.78rem",color:"#f0a060",fontWeight:600}}>Questions:</label>
                <input
                  type="number" min="1" max="500"
                  value={timedCount}
                  onChange={e => {
                    const n = parseInt(e.target.value, 10);
                    const val = Number.isFinite(n) && n > 0 ? n : 1;
                    setTimedCount(val);
                    saveTimedCount(val);
                  }}
                  style={{width:"70px",background:"#0d0d14",border:"1px solid #3a2a10",borderRadius:"6px",padding:"0.3rem 0.5rem",color:"#f0a060",fontFamily:"'Space Mono',monospace",fontSize:"0.85rem",textAlign:"center",outline:"none"}}
                />
              </div>
            </div>
          )}
          <button className="btn-start-quiz" disabled={!canDrill} onClick={startQuiz}>
            {mode === "timed" ? "Start Timed Test" : "Start Drill"}
          </button>
        </>
      )}

      {mainTab === "edit" && (
        <>
          {!confirmingReset ? (
            <button className="btn btn-ghost btn-sm" style={{marginBottom:"1rem",width:"100%"}}
              onClick={() => setConfirmingReset(true)}>
              Reset to Defaults
            </button>
          ) : (
            <div style={{display:"flex",gap:"0.5rem",marginBottom:"1rem"}}>
              <button className="btn btn-danger btn-sm" style={{flex:1}} onClick={resetToDefaults}>
                Confirm Reset — Erases All Edits
              </button>
              <button className="btn btn-ghost btn-sm" style={{flex:1}} onClick={() => setConfirmingReset(false)}>
                Cancel
              </button>
            </div>
          )}
          <div className="cat-tabs">
            {categories.map(c => (
              <button key={c.id} className={`cat-tab ${activeCatId===c.id?"active":""} ${c.inA?"in-a":""} ${c.inB?"in-b":""}`}
                onClick={() => setActiveCatId(c.id)}>
                {c.name}
                {(c.inA||c.inB) && <span style={{marginLeft:"0.4rem",fontSize:"0.68rem",color:"#5a7a5a"}}>{c.inA&&"A"}{c.inA&&c.inB&&"+"}{c.inB&&"B"}</span>}
              </button>
            ))}
            <button className="btn btn-ghost btn-sm" onClick={addCategory}>+ New</button>
          </div>
          {activeCat ? (
            <div className="card">
              <CategoryEditor key={activeCat.id} cat={activeCat} onChange={updateCat} onDelete={() => deleteCat(activeCat.id)}
                adaptiveWeights={adaptiveWeights} onSetAdaptive={setAdaptive} />
            </div>
          ) : (
            <div className="card" style={{textAlign:"center",color:"#5a5a7a",padding:"2.5rem"}}>
              No categories yet.{" "}
              <button className="btn btn-green btn-sm" style={{marginLeft:"0.5rem"}} onClick={addCategory}>Create one</button>
            </div>
          )}
          <p style={{fontSize:"0.75rem",color:"#3a3a5a",marginTop:"0.75rem",textAlign:"center"}}>
            Use the A / B toggles in each category header to assign it to a drill set.
          </p>
        </>
      )}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (err) {
  document.getElementById("root").innerHTML =
    '<div style="padding:2rem;color:#f08090;font-family:monospace;white-space:pre-wrap;">Render error: ' +
    (err && err.message ? err.message : String(err)) + '</div>';
}
</script>
</body>
</html>
